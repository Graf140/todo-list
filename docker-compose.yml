services:
  db:
    image: postgres:16-alpine
    container_name: todo-list-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: todo-list
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db_init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d todo-list"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: dockerfile
      target: backend
    container_name: todo-list-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DB_HOST: db
      DB_NAME: todo-list
      DB_USER: postgres
      DB_PASSWORD: admin
      DB_PORT: 5432
      SECRET_KEY: your_super_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FRONTEND_URL: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: dockerfile
      target: frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: todo-list-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
